[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008", "B904", "E711", "E712", "F841", "N802", "N803", "N805", "N806", "N815", "N816"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
