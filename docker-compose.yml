services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: restaurant_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: caravane_db
      POSTGRES_USER: caravane_user
      POSTGRES_PASSWORD: caravane_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - restaurant_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caravane_user -d caravane_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build: .
    container_name: restaurant_api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://caravane_user:caravane_password@db:5432/caravane_db?schema=public
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-dev-twilio-token}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-+1234567890}
      - GUIDINI_APP_KEY=${GUIDINI_APP_KEY:-dev-guidini-app-key}
      - GUIDINI_API_KEY=${GUIDINI_API_KEY:-dev-guidini-api-key}
      - SERVICE_TOKEN=${SERVICE_TOKEN:-dev-service-token-change-in-production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - restaurant_network
    volumes:
      - api_logs:/app/logs
    command: >
      sh -c "
        echo '🔄 Running database migrations...' &&
        python -m prisma migrate deploy &&
        echo '🌱 Seeding database...' &&
        python scripts/seed_db.py &&
        echo '🚀 Starting API server...' &&
        uvicorn main:app --host 0.0.0.0 --port 8001
      "

volumes:
  postgres_data:
    driver: local
  api_logs:
    driver: local

networks:
  restaurant_network:
    driver: bridge
